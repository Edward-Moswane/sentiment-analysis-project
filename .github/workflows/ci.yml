
name: Sentiment Analysis CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run automated tests
        run: pytest -v test_app.py

      - name: Build Docker image
        run: docker build -t sentiment-analysis:latest .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: |
          docker tag sentiment-analysis:latest edwardmoswane/sentiment-analysis-project:latest
          docker tag sentiment-analysis:latest edwardmoswane/sentiment-analysis-project:${{ github.sha }}
          docker push edwardmoswane/sentiment-analysis-project:latest
          docker push edwardmoswane/sentiment-analysis-project:${{ github.sha }}
